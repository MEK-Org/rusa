name: CI

on:
  pull_request:
    branches: [master, staging]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    # Backstop so no single hung step can hold the required check (and every
    # merge behind it) for GitHub's 6-hour default. A normal green run takes
    # well under 15 minutes; anything past 30 is a hang, and failing fast makes
    # it visible and re-runnable instead of silently blocking.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Reject NUL bytes in source files
        run: |
          files="$(
            git ls-files -z -- \
              '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.jsonc' '*.md' '*.css' '*.yml' '*.yaml' '*.dart' \
              | perl -0ne '
                chomp;
                open my $fh, "<:raw", $_ or die "cannot read $_: $!";
                local $/;
                my $body = <$fh>;
                print "$_\n" if index($body, "\0") >= 0;
              '
          )"
          if [ -n "$files" ]; then
            echo "NUL bytes found in tracked source files:"
            echo "$files"
            echo "Remove them with: tr -d '\\000' < file > file.tmp && mv file.tmp file"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Test-only host setup, deferred until after lint + typecheck pass so a
      # fast-check failure never pays for the apt-get install or the suite.
      # The runner's Azure Ubuntu mirror degrades two ways (both observed
      # 2026-08-19): connections that never respond, and transfers at
      # ~100 kB/s that can't finish an `apt-get update` inside a tight bound.
      # So: first try installing straight from the image's existing package
      # indexes (no index refresh needed when they're fresh enough), then
      # fall back to bounded update+install attempts sized for the
      # slow-but-alive mirror case.
      # Acquire options make apt abandon a dead mirror connection after 30s
      # and retry internally (observed 2026-08-19: even the 50 kB .deb fetch
      # can stall on a dead connection after a successful update).
      # DEBIAN_FRONTEND is belt-and-braces: nothing here prompts with -y, but
      # it removes the interactive-prompt class entirely.
      - name: Install bubblewrap
        timeout-minutes: 17
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          if timeout 120 sudo -E apt-get $APT_OPTS install -y bubblewrap; then
            exit 0
          fi
          for attempt in 1 2; do
            if timeout 300 sudo -E apt-get $APT_OPTS update && timeout 120 sudo -E apt-get $APT_OPTS install -y bubblewrap; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed or timed out; retrying in 15s..."
            sleep 15
          done
          echo "bubblewrap install failed after bounded attempts"
          exit 1

      - name: Enable unprivileged user namespaces (for real-bwrap tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm -r --if-present test

      # Shifted-clock run (#1218): the retention/expiry-owning test surface,
      # run again with Date faked 45 days ahead of the real clock (still
      # advancing), so a dated fixture that only passes at today's real date
      # fails the day it is written instead of weeks later (#1184, #1210).
      # Tests that pin their own clock override the shift by design. The
      # scope keeps the run bounded instead of doubling suite time, and
      # excludes suites whose assertions sit on OS-level clocks or mtimes,
      # which any fake Date breaks independent of the shift (verified with a
      # one-minute probe). The shift exceeds every retention and expiry
      # window the code measures against Date.now(), audited at bd8a1122:
      #   30d  quota raw + observation retention (quota/shared-store.ts)
      #   30d  run material retention (remote-instances/run-material.ts)
      #   30d  run prompt retention (db/repositories/run-prompt-repository.ts)
      #   30d  invocation artifact retentionDays default (commands/config-docs.ts)
      #   7d   weekly quota bucket + provider pacer weekly window
      #   7d   dashboard timing retention (dashboard/timing.ts)
      #   7d   hard runtime cap (actor/host-job-runner.ts)
      #   5d   dashboard auth session (dashboard/auth.ts)
      #   3d   quota history window (quota/coordinator-protocol.ts)
      #   1d   codex models cache max age, quota backup interval
      #   ≤30m quota probe TTL, weekly quota max age, 15m stamp expiry
      # Scoped packages (mirrored in vitest.shifted.config.ts): quota, the
      # quota/stamp/timing MCP tests, dashboard quota-api/auth/timing, actor
      # pacer + availability holds, run-prompt repository, run material +
      # event transfer, model catalog, references, slack, observability,
      # quota commands, and the pinned-clock helper. Typecheck already ran
      # with the ordinary suite; this pass is behavioral only.
      - name: Shifted-clock vitest run
        run: pnpm --filter rusa run test:shifted
